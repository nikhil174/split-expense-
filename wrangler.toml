name = "split-expense"
main = "src/index.js"
compatibility_date = "2026-10-28"
keep_vars = true

[secrets]
required = ["ADMIN_PIN", "SESSION_SECRET"]

# Builds the React app (web/) into dist/ before `wrangler dev` / `wrangler deploy`,
# including Cloudflare's Git-triggered deploys. `npm install` makes sure Vite is
# present even if the build environment did not install dependencies first
# (it is a quick no-op when they are already installed). Type-checking runs in CI.
[build]
command = "npm install --no-audit --no-fund && npm run build:web"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "split-expense"
database_name = "split_expense_db"
database_id = "5820131f-8799-405f-b91d-fcc4cbe0fb53"
migrations_dir = "migrations"
